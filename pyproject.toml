[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-the-sensors"
version = "0.1.0"
description = "Grounded, explainable activity QA from wearable accelerometer + gyroscope signals (CS60055 Hackathon Challenge 1)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
